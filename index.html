<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visio · HomoSapiens</title></head><body><main><h1>Visio</h1><p>Superfície pública conectada ao runtime HomoSapiens.</p><div id="status">Verificando runtime…</div><textarea id="prompt" placeholder="Descreva a imagem"></textarea><button id="run">Gerar</button><div id="msg"></div><div id="preview"></div></main><script>(()=>{const BASE="https://visio-runtime-preview.homosapiens.id",st=document.querySelector("#status"),p=document.querySelector("#prompt"),b=document.querySelector("#run"),m=document.querySelector("#msg"),v=document.querySelector("#preview");fetch(BASE+"/health").then(r=>r.json()).then(j=>st.textContent=j.openai_configured?"Visio online · OpenAI conectada":"Visio online").catch(()=>st.textContent="Status indisponível");b.onclick=async()=>{const i=p.value.trim();if(i.length<3){m.textContent="Descreva a imagem.";return}b.disabled=true;m.textContent="Processando…";try{const z=new FormData;z.set("instruction",i);z.set("output_format","png");z.set("size","1024x1024");z.set("quality","medium");const r=await fetch(BASE+"/api/public/auto",{method:"POST",body:z});if(!r.ok)throw new Error(await r.text());const ct=r.headers.get("content-type")||"";if(ct.startsWith("image/")){const u=URL.createObjectURL(await r.blob());v.innerHTML="<img style='max-width:100%' alt='Resultado Visio'>";v.querySelector("img").src=u}else{const j=await r.json();if(j.url){v.innerHTML="<img style='max-width:100%' alt='Resultado Visio'>";v.querySelector("img").src=j.url}}m.textContent="Concluído."}catch(e){m.textContent="Não foi possível concluir."}finally{b.disabled=false}}})();</script></body></html>
