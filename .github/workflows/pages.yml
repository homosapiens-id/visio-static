name: Validate Visio static mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate static surface
        run: |
          test -f index.html
          test -f app/index.html
          test -f app/studio.js
          test -f app/studio.css
          test -f app/digital-human.js
          test -f app/digital-human.css
          test -f app/personal-voice.js
          node --check app/studio.js
          node --check app/digital-human.js
          node --check app/personal-voice.js
      - name: Deployment note
        run: |
          echo "Production static deployment target is Hosting, not GitHub Pages."
